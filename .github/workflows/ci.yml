name: Client CI
on:
  pull_request:
  push:
    branches: [main, codex/bootstrap-base, codex/client-foundation]

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:export
      - run: pnpm typecheck
      - run: pnpm test
      # Unit tests once passed a generated unit that systemd refused to load; its own parser decides.
      - name: systemd parses the generated user unit
        run: |
          systemd-analyze --version
          pnpm exec vitest run packages/cli/src/serve-service.test.ts -t "systemd's own parser"
        env:
          SHAREDNET_REQUIRE_SYSTEMD_ANALYZE: "1"
      - run: pnpm test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-candidate-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete client history
        run: '"${{ runner.temp }}/gitleaks" git . --redact --no-banner'
